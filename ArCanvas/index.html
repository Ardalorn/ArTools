<style>
  /* ── Tokens (from boilerplate-AA light theme). Locked to light: the device's dark setting is ignored. ── */
  :root {
    color-scheme: light;

    --paper: #EEF2EF;
    --paper-2: #DEE7E2;
    --ink: #12221E;
    --soft: #3A4D47;
    --edge: #5B736A;

    --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-heading: Lato, var(--font-body);

    --focus: var(--ink);
    --radius: 4px;

    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --touch-min: 44px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    overscroll-behavior: none;
    touch-action: none;
  }

  button {
    font: inherit;
    letter-spacing: inherit;
    word-spacing: inherit;
  }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  #canvas {
    position: fixed;
    inset: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
    touch-action: none;
    cursor: crosshair;
  }

  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: calc(10px + var(--sat)) calc(14px + var(--sar)) 10px calc(14px + var(--sal));
    background: var(--paper);
    background: color-mix(in srgb, var(--paper) 94%, transparent);
    backdrop-filter: blur(12px) saturate(1.2);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.4s ease;
    transform: translateY(0);
    opacity: 1;
    padding-top: max(10px, var(--sat));
  }
  .header.hidden-ui {
    transform: translateY(-150%);
    opacity: 0;
    pointer-events: none;
  }
  .header-title {
    font-family: var(--font-heading);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--ink);
  }
  .focus-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: var(--touch-min);
    padding: 0.5rem 1rem;
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    background: var(--ink);
    color: var(--paper);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .focus-btn:hover { background: var(--soft); border-color: var(--soft); }
  .focus-btn:active { transform: scale(0.94); }

  .toolbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 10;
    background: var(--paper);
    background: color-mix(in srgb, var(--paper) 96%, transparent);
    backdrop-filter: blur(14px) saturate(1.1);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    border-top: 2px solid var(--ink);
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 10px calc(12px + var(--sar)) calc(14px + var(--sab)) calc(12px + var(--sal));
    padding-bottom: max(14px, calc(8px + var(--sab)));
    border-radius: var(--radius) var(--radius) 0 0;
    transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.4s ease;
    transform: translateY(0);
    opacity: 1;
  }
  .toolbar.hidden-ui {
    transform: translateY(130%);
    opacity: 0;
    pointer-events: none;
  }

  .tool-group {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }
  .tool-label {
    display: none;
  }
  .divider {
    width: 1px;
    height: 28px;
    background: var(--edge);
    flex-shrink: 0;
  }

  .tool-slot {
    width: var(--touch-min);
    height: var(--touch-min);
    border-radius: var(--radius);
    border: 2px solid var(--edge);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    flex-shrink: 0;
    position: relative;
  }
  .tool-slot:hover { background: var(--paper-2); border-color: var(--ink); }
  .tool-slot:active { transform: scale(0.92); }

  .thickness-dot {
    border-radius: 50%;
    background: var(--ink);
    display: block;
    transition: width 0.2s ease, height 0.2s ease;
  }
  .thickness-dot.small  { width: 6px;  height: 6px; }
  .thickness-dot.medium { width: 14px; height: 14px; }
  .thickness-dot.large  { width: 24px; height: 24px; }
  .thickness-dot.xlarge { width: 36px; height: 36px; }

  .color-slot-inner {
    width: 28px;
    height: 28px;
    border: 2px solid var(--ink);
    border-radius: 50%;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .tool-slot:active .color-slot-inner { transform: scale(0.9); }

  .tool-slot svg {
    width: 22px; height: 22px;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke: var(--ink);
  }
  /* Selected tool: paper tint, ink edge and a heavier bottom edge, so it does not rely on colour alone. */
  .tool-slot.active {
    border-color: var(--ink);
    background: var(--paper-2);
    box-shadow: inset 0 -4px 0 var(--ink);
  }
  #stampIconPath { stroke-width: 8; }

  .action-btn {
    width: var(--touch-min);
    height: var(--touch-min);
    border-radius: var(--radius);
    border: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.2s ease, transform 0.15s ease;
    flex-shrink: 0;
  }
  .action-btn:hover { background: var(--paper-2); }
  .action-btn:active { transform: scale(0.92); }
  .action-btn svg {
    width: 20px; height: 20px;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke: currentColor;
  }

  /* Dynamic Island */
  .island-wrapper {
    position: fixed;
    top: max(6px, calc(var(--sat) + 4px));
    left: 50%;
    transform: translateX(-50%) scale(0.85);
    z-index: 20;
    width: 44px; height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease, transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .island-wrapper.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) scale(1);
  }
  .island-btn {
    width: 32px; height: 16px;
    border-radius: 8px;
    background: var(--ink);
    border: none;
    cursor: pointer;
    position: relative;
    transition: transform 0.3s ease, background-color 0.3s ease;
  }
  .island-btn::after {
    content: '';
    position: absolute;
    inset: -14px;
    border-radius: 50%;
  }
  .island-btn:hover {
    transform: scale(1.15);
  }
  .island-btn:active { transform: scale(0.95); }
  @keyframes island-breathe {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }
  .island-wrapper.visible .island-btn {
    animation: island-breathe 3s ease-in-out infinite;
  }

  @keyframes island-urgent {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.25); }
  }
  .island-btn.session-pulse {
    animation: island-urgent 1.2s ease-in-out infinite !important;
    background: var(--soft);
  }

  @media (min-width: 601px) {
    .toolbar {
      left: 0; top: 50%; right: auto; bottom: auto;
      transform: translateY(-50%);
      flex-direction: column;
      padding: 18px calc(10px + var(--sal)) 18px calc(10px + var(--sal));
      border: 2px solid var(--ink);
      border-left: none;
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .toolbar.hidden-ui {
      transform: translateY(-50%) translateX(-130%);
    }
    .tool-group {
      flex-direction: column;
      gap: 8px;
    }
    .tool-label {
      display: block;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--soft);
      margin-bottom: 2px;
      text-align: center;
    }
    .divider {
      width: 28px;
      height: 1px;
    }
    .island-wrapper {
      top: max(10px, calc(var(--sat) + 6px));
    }
  }

  .header, .toolbar, .island-wrapper { user-select: none; -webkit-user-select: none; }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background: var(--paper);
    pointer-events: none;
  }

  /* Forced colours (Windows contrast themes and similar) */
  @media (forced-colors: active) {
    .tool-slot.active { border-color: Highlight; }
  }

  /* Motion preferences. 0.01ms rather than none, so anything waiting on transitionend still gets it. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      transition-delay: 0s !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<header class="header" id="header">
  <div class="header-title">ArCanvas</div>
  <button class="focus-btn" id="focusBtn" aria-label="Enter Focus Mode">Focus</button>
</header>

<nav class="toolbar" id="toolbar" aria-label="Drawing Tools">
  <div class="tool-group">
    <span class="tool-label">Size</span>
    <button class="tool-slot" id="thicknessBtn" aria-label="Change brush size">
      <span class="thickness-dot medium" id="thicknessDot"></span>
    </button>
  </div>

  <div class="divider"></div>

  <div class="tool-group">
    <span class="tool-label">Color</span>
    <button class="tool-slot" id="colorBtn" aria-label="Change color">
      <span class="color-slot-inner" id="colorSlotInner" style="background:var(--ink)"></span>
    </button>
  </div>

  <div class="divider"></div>

  <div class="tool-group">
    <span class="tool-label">Tool</span>
    <button class="tool-slot" id="eraseBtn" aria-label="Toggle eraser">
      <svg viewBox="0 0 24 24"><path d="m19.5 12-6 6a2.12 2.12 0 0 1-3 0L6 13.5a2.12 2.12 0 0 1 0-3l6-6a2.12 2.12 0 0 1 3 0l4.5 4.5a2.12 2.12 0 0 1 0 3Z"/><path d="M9 15l-4 4"/></svg>
    </button>
    <button class="tool-slot" id="stampBtn" aria-label="Stamp: star">
      <svg viewBox="0 0 100 100"><path id="stampIconPath" d="M50,6 Q56,20 58,34 Q75,24 90,30 Q70,42 64,50 Q73,72 78,92 Q60,76 50,68 Q40,80 16,88 Q30,64 34,48 Q14,42 4,32 Q26,34 40,32 Q46,18 50,6 Z"/></svg>
    </button>
  </div>

  <div class="divider"></div>

  <div class="tool-group">
    <span class="tool-label">Actions</span>
    <button class="action-btn" id="clearBtn" aria-label="Clear all">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14Z"/></svg>
    </button>
    <button class="action-btn" id="saveBtn" aria-label="Save drawing">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    </button>
  </div>
</nav>

<div class="island-wrapper" id="islandWrapper" aria-label="Restore UI">
  <button class="island-btn" id="islandBtn"></button>
</div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const header = document.getElementById('header');
  const toolbar = document.getElementById('toolbar');
  const focusBtn = document.getElementById('focusBtn');
  const islandWrapper = document.getElementById('islandWrapper');
  const islandBtn = document.getElementById('islandBtn');
  const clearBtn = document.getElementById('clearBtn');
  const saveBtn = document.getElementById('saveBtn');
  const thicknessBtn = document.getElementById('thicknessBtn');
  const thicknessDot = document.getElementById('thicknessDot');
  const colorBtn = document.getElementById('colorBtn');
  const colorSlotInner = document.getElementById('colorSlotInner');
  const eraseBtn = document.getElementById('eraseBtn');
  const stampBtn = document.getElementById('stampBtn');
  const stampIconPath = document.getElementById('stampIconPath');

  /* Theme tokens are read from CSS, so the canvas and ink use the page's paper and ink colours. */
  const rootStyle = getComputedStyle(document.documentElement);
  function themeVar(name) { return rootStyle.getPropertyValue(name).trim(); }

  const sizes = [
    { px: 6,  cls: 'small' },
    { px: 16, cls: 'medium' },
    { px: 32, cls: 'large' },
    { px: 48, cls: 'xlarge' }
  ];
  /* The first colour is the theme's ink; the rest are fixed pastels. */
  const colors = [
    { token: '--ink', name: 'Ink' },
    { hex: '#8fa882', name: 'Sage' },
    { hex: '#7b91a3', name: 'Slate' },
    { hex: '#c98b7a', name: 'Terracotta' },
    { hex: '#d1b47e', name: 'Ochre' },
    { hex: '#a599b5', name: 'Lavender' }
  ];
  function colorValue(c) { return c.token ? themeVar(c.token) : c.hex; }
  function colorSwatch(c) { return c.token ? 'var(' + c.token + ')' : c.hex; }

  const stamps = [
    { name: 'star', d: 'M50,6 Q56,20 58,34 Q75,24 90,30 Q70,42 64,50 Q73,72 78,92 Q60,76 50,68 Q40,80 16,88 Q30,64 34,48 Q14,42 4,32 Q26,34 40,32 Q46,18 50,6 Z' },
    { name: 'happy face', d: 'M50,8 Q80,10 88,38 Q94,64 68,86 Q46,98 20,80 Q2,58 10,32 Q18,10 50,8 Z' },
    { name: 'paw', d: 'M50,58 Q72,56 74,74 Q76,92 50,92 Q26,92 26,74 Q26,58 50,58 Z M16,28 Q26,30 26,42 Q26,52 16,50 Q6,48 6,38 Q6,28 16,28 Z M34,6 Q46,8 45,20 Q45,32 33,30 Q22,28 22,18 Q22,6 34,6 Z M64,4 Q76,6 76,18 Q76,30 64,29 Q52,28 52,17 Q52,5 64,4 Z M84,26 Q94,28 94,38 Q94,48 84,48 Q74,48 74,38 Q74,28 84,26 Z' },
    { name: 'cat', d: 'M22,10 Q30,24 34,30 Q50,22 66,28 Q72,20 80,8 Q92,26 90,55 Q88,80 60,92 Q46,98 38,90 Q14,82 8,52 Q6,26 22,10 Z' }
  ];
  const stampSizes = [40, 64, 92, 130];

  let sizeIndex = 1;
  let colorIndex = 0;
  let stampIndex = 0;
  let brushSize = sizes[sizeIndex].px;
  let brushColor = colorValue(colors[colorIndex]);
  let tool = 'brush';
  let focusMode = false;
  let idleTimer = null;
  let hasDrawn = false;

  /* ─── Multi-touch pointer tracking ─── */
  const activePointers = new Map();

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cssW = window.innerWidth;
    const cssH = window.innerHeight;
    const need = canvas.width !== Math.floor(cssW * dpr) || canvas.height !== Math.floor(cssH * dpr);
    if (!need) return;

    const temp = document.createElement('canvas');
    temp.width = canvas.width; temp.height = canvas.height;
    const tCtx = temp.getContext('2d');
    tCtx.drawImage(canvas, 0, 0);

    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.drawImage(temp, 0, 0, temp.width, temp.height, 0, 0, cssW, cssH);

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    applyToolState();
  }

  /* The canvas stays transparent: the page's themed paper shows through,
     and the eraser simply removes ink. */
  resizeCanvas();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  applyToolState();

  let resizeDebounce;
  window.addEventListener('resize', () => {
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(resizeCanvas, 150);
  });

  function applyToolState() {
    if (tool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = brushColor;
    }
    ctx.lineWidth = brushSize;
  }

  function setTool(newTool) {
    tool = newTool;
    eraseBtn.classList.toggle('active', tool === 'eraser');
    stampBtn.classList.toggle('active', tool === 'stamp');
    applyToolState();
  }

  /* ─── Thickness slot: tap to cycle ─── */
  thicknessBtn.addEventListener('click', () => {
    sizeIndex = (sizeIndex + 1) % sizes.length;
    brushSize = sizes[sizeIndex].px;
    thicknessDot.className = 'thickness-dot ' + sizes[sizeIndex].cls;
    ctx.lineWidth = brushSize;
  });

  /* ─── Color slot: tap to cycle ─── */
  colorBtn.addEventListener('click', () => {
    colorIndex = (colorIndex + 1) % colors.length;
    brushColor = colorValue(colors[colorIndex]);
    colorSlotInner.style.background = colorSwatch(colors[colorIndex]);
    colorBtn.setAttribute('aria-label', 'Color: ' + colors[colorIndex].name);
    if (tool === 'eraser') setTool('brush');
    else applyToolState();
  });

  /* ─── Erase slot: tap to toggle ─── */
  eraseBtn.addEventListener('click', () => {
    setTool(tool === 'eraser' ? 'brush' : 'eraser');
  });

  /* ─── Stamp slot: tap to activate, tap again to cycle shape ─── */
  stampBtn.addEventListener('click', () => {
    if (tool !== 'stamp') {
      setTool('stamp');
    } else {
      stampIndex = (stampIndex + 1) % stamps.length;
      stampIconPath.setAttribute('d', stamps[stampIndex].d);
      stampBtn.setAttribute('aria-label', 'Stamp: ' + stamps[stampIndex].name);
    }
  });

  function drawStampDetail(name) {
    ctx.fillStyle = 'rgba(61,64,74,0.85)';
    ctx.strokeStyle = 'rgba(61,64,74,0.85)';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    if (name === 'happy face') {
      ctx.beginPath(); ctx.ellipse(36,42,5,6,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(63,39,4.5,5.5,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(34,58); ctx.quadraticCurveTo(50,74,66,54); ctx.stroke();
    } else if (name === 'cat') {
      ctx.beginPath(); ctx.ellipse(37,50,4,5.5,-0.15,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(62,49,4,5.5,0.15,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(50,60); ctx.lineTo(46,66); ctx.lineTo(54,66); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(20,58); ctx.lineTo(2,54);
      ctx.moveTo(18,66); ctx.lineTo(0,68);
      ctx.moveTo(80,58); ctx.lineTo(98,54);
      ctx.moveTo(82,66); ctx.lineTo(100,68);
      ctx.stroke();
    }
  }

  function placeStamp(x, y) {
    const size = stampSizes[sizeIndex];
    const jitter = (Math.random() - 0.5) * 0.5;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(jitter);
    ctx.scale(size / 100, size / 100);
    ctx.translate(-50, -50);
    const path = new Path2D(stamps[stampIndex].d);
    ctx.fillStyle = brushColor;
    ctx.fill(path);
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(61,64,74,0.35)';
    ctx.stroke(path);
    drawStampDetail(stamps[stampIndex].name);
    ctx.restore();
  }

  /* ─── Pointer Events (multi-touch) ─── */
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function startDraw(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const id = e.pointerId;
    const pos = getPos(e);
    activePointers.set(id, { lastX: pos.x, lastY: pos.y });

    /* Haptic feedback on first touch of a gesture */
    if (activePointers.size === 1 && navigator.vibrate) {
      try { navigator.vibrate(5); } catch (e) {}
    }

    hasDrawn = true;
    if (tool === 'stamp') {
      placeStamp(pos.x, pos.y);
      resetIdleTimer();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    resetIdleTimer();
  }

  function draw(e) {
    if (tool === 'stamp') return;
    const id = e.pointerId;
    const ptr = activePointers.get(id);
    if (!ptr) return;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(ptr.lastX, ptr.lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    ptr.lastX = pos.x;
    ptr.lastY = pos.y;
    resetIdleTimer();
  }

  function endDraw(e) {
    activePointers.delete(e.pointerId);
    resetIdleTimer();
  }

  canvas.addEventListener('pointerdown', startDraw);
  canvas.addEventListener('pointermove', draw);
  canvas.addEventListener('pointerup', endDraw);
  canvas.addEventListener('pointercancel', endDraw);
  canvas.addEventListener('pointerleave', endDraw);

  /* ─── Clear All ─── */
  clearBtn.addEventListener('click', () => {
    const cssW = canvas.width / (Math.min(window.devicePixelRatio || 1, 3));
    const cssH = canvas.height / (Math.min(window.devicePixelRatio || 1, 3));
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.restore();
    applyToolState();
  });

  /* ─── Save ─── */
  saveBtn.addEventListener('click', () => {
    /* The canvas is transparent, so flatten it onto the current paper colour first. */
    const out = document.createElement('canvas');
    out.width = canvas.width;
    out.height = canvas.height;
    const outCtx = out.getContext('2d');
    outCtx.fillStyle = themeVar('--paper');
    outCtx.fillRect(0, 0, out.width, out.height);
    outCtx.drawImage(canvas, 0, 0);

    const link = document.createElement('a');
    link.download = 'calm-canvas-' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.png';
    link.href = out.toDataURL('image/png');
    link.click();
  });

  /* ─── Focus Mode ─── */
  function enterFocusMode() {
    focusMode = true;
    header.classList.add('hidden-ui');
    toolbar.classList.add('hidden-ui');
    focusBtn.textContent = 'Exit';
    resetIdleTimer();
  }
  function exitFocusMode() {
    focusMode = false;
    header.classList.remove('hidden-ui');
    toolbar.classList.remove('hidden-ui');
    islandWrapper.classList.remove('visible');
    focusBtn.textContent = 'Focus';
    clearTimeout(idleTimer);
  }
  focusBtn.addEventListener('click', () => { focusMode ? exitFocusMode() : enterFocusMode(); });
  islandBtn.addEventListener('click', exitFocusMode);

  /* ─── Idle System (3s fade) ─── */
  function resetIdleTimer() {
    if (!focusMode) return;
    islandWrapper.classList.add('visible');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { islandWrapper.classList.remove('visible'); }, 3000);
  }
  ['pointermove','pointerdown','touchstart'].forEach(evt => {
    document.addEventListener(evt, () => { if (focusMode) resetIdleTimer(); }, { passive: true });
  });

  /* ─── 10-minute session reminder ─── */
  setTimeout(() => {
    islandBtn.classList.add('session-pulse');
  }, 600000);

  /* ─── Android 16: Prevent back gesture exit ─── */
  window.addEventListener('beforeunload', (e) => {
    if (hasDrawn) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ─── Service Worker ─── */
  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.match(e.request).then(r => {
            return r || fetch(e.request).catch(() => new Response('Offline', {status: 503}));
          })
        );
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }

  /* ─── Visibility pause ─── */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      activePointers.clear();
    }
  });
})();
</script>
</body>
</html>
